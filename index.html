<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Manager">
<!-- Le fond réel de l'app, pas une couleur héritée d'une version d'avant :
     c'est cette teinte que le téléphone met autour de l'écran. -->
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<title>Le Manager — draft Brawl Stars</title>
<!-- Il y avait ici deux polices Google, Lilita One et Nunito. Vérifié le
     04/08/2026 : plus une seule ligne de style.css ne les appelait. Elles
     restaient chargées depuis une version précédente, et coûtaient trois
     requêtes bloquantes à l'ouverture — sur un téléphone, en plein draft.
     L'app est en typographie système depuis, c'est ce qui la fait démarrer
     tout de suite. -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Toute l'interface est fabriquée en JavaScript et déposée ici. -->
<div id="app"></div>

<!--
  Les fichiers se chargent dans cet ordre, chacun s'appuyant sur le précédent.
  Chaque fichier répond à une seule question :

    langues.js    tous les textes affichés, en français, anglais et espagnol
    outils.js     petites fonctions de base (nettoyer un nom, échapper du texte)
    donnees.js    d'où viennent les chiffres — réécrit par refresh.py
    etat.js       ce que l'app retient (carte choisie, picks, brawlers cochés)
    moteur.js     comment le brawler conseillé est calculé
    vues.js       comment tout ça est affiché
    app.js        ce qui se passe quand on touche l'écran

  Ce sont des scripts classiques, pas des modules : ils fonctionnent aussi
  bien en ouvrant le fichier directement que depuis un hébergeur.

  Les explications de matchup NE SONT PAS dans cette liste, et c'est voulu,
  pour deux raisons distinctes :

    — elles pesaient 322 Ko sur les 524 qu'il fallait attendre avant de voir
      la moindre chose, soit 11,1 s d'écran noir en 3G lente. app.js les
      demande APRÈS le premier dessin, pour que le choix de la carte — qui
      est toujours le premier geste — n'attende pas la table des duels ;

    — elles existaient en trois langues dans un seul fichier, alors qu'on
      n'en lit qu'une. app.js demande counters-<langue>.js, la langue étant
      déjà connue (choix enregistré, sinon navigator.languages). 172 Ko en
      français au lieu de 323 : −47 %.

  counters.js reste la SOURCE, avec ses trois langues et ses marqueurs
  @DATA: que refresh.py écrit. Il n'est simplement plus servi au navigateur.
  outils/counters_par_langue.py en engendre les trois variantes, et
  tests/t_refresh.py vérifie qu'elles sont à jour.
-->
<script src="langues.js"></script>
<script src="outils.js"></script>
<script src="donnees.js"></script>
<script src="etat.js"></script>
<script src="moteur.js"></script>
<script src="vues.js"></script>
<script src="app.js"></script>

<!-- Pour que l'app s'ouvre même sans réseau. Elle s'emploie dans un salon
     d'attente de 25 secondes, en 4G moyenne : sans ce petit script, une
     connexion absente au mauvais moment ne dégradait pas l'app, elle
     l'empêchait de s'ouvrir. Enregistré APRÈS le reste, et sans bloquer :
     s'il échoue, l'app fonctionne exactement comme avant. -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function () {
      /* Le worker ne contrôle pas encore la page au premier chargement : le
         fichier d'explications est donc déjà passé à côté de lui. On lui dit
         lequel garder, sinon une première visite suivie d'une coupure laisse
         l'app sans aucun duel. */
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      if (reg.active) reg.active.postMessage({ garder: "counters-" + langue + ".js" });
    }).catch(function () {
      /* Navigation privée, page servie en http, navigateur ancien : ce n'est
         pas un incident, c'est juste l'app sans son filet. */
    });
  });
}
</script>

</body>
</html>
