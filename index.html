<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Manager">
<meta name="theme-color" content="#211545">
<title>Le Manager — draft Brawl Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Toute l'interface est fabriquée en JavaScript et déposée ici. -->
<div id="app"></div>

<!--
  Les fichiers se chargent dans cet ordre, chacun s'appuyant sur le précédent.
  Chaque fichier répond à une seule question :

    outils.js     petites fonctions de base (nettoyer un nom, échapper du texte)
    donnees.js    d'où viennent les chiffres — seul fichier réécrit par refresh.py
    etat.js       ce que l'app retient (carte choisie, picks, brawlers cochés)
    moteur.js     comment le brawler conseillé est calculé
    vues.js       comment tout ça est affiché
    app.js        ce qui se passe quand on touche l'écran

  Ce sont des scripts classiques, pas des modules : ils fonctionnent aussi
  bien en ouvrant le fichier directement que depuis un hébergeur.
-->
<script src="outils.js"></script>
<script src="donnees.js"></script>
<script src="etat.js"></script>
<script src="moteur.js"></script>
<script src="vues.js"></script>
<script src="app.js"></script>

</body>
</html>
