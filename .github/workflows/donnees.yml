# Rafraîchit les données de l'app, sur les serveurs de GitHub.
#
# Deux raisons d'être ici plutôt que sur le Mac de l'utilisateur :
#   - il n'a rien à lancer, rien à installer, et n'est prévenu que si ça casse ;
#   - les journaux sont lisibles à distance, donc un diagnostic ne demande plus
#     de capture d'écran.
#
# Rien n'est écrit tant que les 132 contrôles de la suite ne sont pas verts.

name: Données

on:
  schedule:
    # Tous les lundis à 6 h UTC. Une saison dure deux mois ; une fois par
    # semaine suffit largement, et laisse le temps de voir venir une panne.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      images:
        description: "Télécharger les images des brawlers et des cartes"
        type: boolean
        default: false
      diagnostic:
        description: "Diagnostic seul, sans rien écrire"
        type: choice
        default: "non"
        options: ["non", "pool", "carte", "carte-ninja", "counters", "maps",
                  "rotation", "ranked", "ninja", "events", "modes", "onglets", "site",
                  "topbrawl", "tiers"]

# Nécessaire pour que le robot puisse commiter donnees.js.
permissions:
  contents: write

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le navigateur vit ici, pas sur la machine de l'utilisateur.
      - name: Installer Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Diagnostic
        if: inputs.diagnostic != '' && inputs.diagnostic != 'non'
        run: python3 refresh.py --debug "${{ inputs.diagnostic }}" --sans-cache

      - name: Relever les données
        if: inputs.diagnostic == '' || inputs.diagnostic == 'non'
        # Le script sort en erreur quand une source bloque. Ce n'est pas une
        # raison de tout arrêter : les autres blocs peuvent avoir été relevés
        # correctement, et les avertissements restent visibles dans le journal.
        continue-on-error: true
        run: python3 refresh.py --cartes --counters --synergie

      # Les images ne sont pas dans le relevé hebdomadaire : elles ne changent
      # qu'à la sortie d'un brawler, quelques fois par an, et c'est 120
      # téléchargements. On les demande donc à la main, quand il le faut.
      #
      # --sans-bascule : on récupère les fichiers sans activer leur usage.
      # Servir nos propres images plutôt que celles de deux projets de fans est
      # une décision à mesurer, pas un effet de bord d'un téléchargement.
      - name: Télécharger les images
        if: inputs.images == true
        continue-on-error: true
        run: python3 refresh.py --assets --sans-bascule


      # Une phrase traduite entre deux relevés reste sinon dans
      # data/traductions.json sans jamais atteindre l'app. Cette étape ne va
      # sur aucun site : elle recopie, et ne touche qu'aux langues.
      - name: Recopier les traductions
        if: inputs.diagnostic == '' || inputs.diagnostic == 'non'
        run: python3 outils/appliquer_traductions.py

      # APRÈS la recopie des traductions, qui vient justement d'écrire dans
      # counters.js : engendrer avant reviendrait à servir les phrases de la
      # semaine dernière. L'app ne charge plus counters.js — elle charge
      # counters-<langue>.js — donc c'est cette étape qui rend le relevé
      # visible pour l'utilisateur.
      - name: Réengendrer les fichiers par langue
        if: inputs.diagnostic == '' || inputs.diagnostic == 'non'
        run: python3 outils/counters_par_langue.py

      - name: Contrôles
        if: inputs.diagnostic == '' || inputs.diagnostic == 'non'
        # Barrière : un donnees.js qui ne passe pas la suite ne doit jamais
        # atteindre le site. En cas d'échec, l'étape suivante ne s'exécute pas
        # et la modification est simplement abandonnée.
        run: python3 tests/t_refresh.py

      - name: Commiter si les données ont changé
        if: inputs.diagnostic == '' || inputs.diagnostic == 'non'
        run: |
          # TOUT ce que le relevé produit, pas seulement donnees.js.
          # ------------------------------------------------------------------
          # Il n'y avait ici que donnees.js, et le commentaire disait que « les
          # images restent locales à l'exécution » : elles étaient donc
          # téléchargées puis jetées à la fin du travail, ce qui explique
          # qu'assets/ soit resté incomplet et figé.
          # Depuis que la table des duels a quitté donnees.js, counters.js
          # subissait le même sort : réécrit chaque semaine, jamais commité.
          # Et counters-<langue>.js, ce que l'app sert vraiment, en découle.
          PRODUITS="donnees.js counters.js counters-fr.js counters-en.js counters-es.js assets"
          if git diff --quiet -- $PRODUITS; then
            echo "Aucun changement : rien à commiter."
            exit 0
          fi
          git config user.name "Robot données"
          git config user.email "noreply@anthropic.com"
          git add $PRODUITS
          git status --short | head -20
          git commit -m "Donnees rafraichies automatiquement"
          # Le relevé dure plusieurs minutes, pendant lesquelles la branche a
          # pu avancer. Sans ce rebase, l'envoi est refusé et tout le travail
          # est perdu pour une raison qui n'a rien à voir avec les données.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
